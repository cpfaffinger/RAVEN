name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r portal/requirements.txt -r portal/requirements-dev.txt
      - run: python -m unittest discover -s tests
      - run: bash -n install.sh deploy/deploy.sh deploy/remote-install.sh
